# キュー登録のサンプルファイル。
# 実際に使うときはファイル名を <slug>.yaml にリネームし、内容を書き換えてください。
# slug は articles/ 配下のディレクトリ名になります(半角英数とハイフンのみ推奨)。
#
# このファイルを埋めて queue/ に追加し、mainブランチにpushすると、
# GitHub Actions (.github/workflows/generate_drafts.yml) が①〜③を自動実行し、
# 下書きをPRとして作成します(人が編集中は .example.yaml のこのファイル自体は処理されません)。

slug: example-keyword

# 記事タイトル(仮でよい。02_outline.pyがこのタイトルでアウトラインを作る)
title: "【比較】〇〇 おすすめ5選|選び方と注意点"

# 狙うメインキーワード
keyword: "〇〇 おすすめ"

# サブキーワード(カンマ区切り、任意)
sub_keywords: "〇〇 選び方,〇〇 比較"

# 想定読者(ペルソナ)
persona: "初めて〇〇を選ぶ20〜30代"

# 競合記事のタイトル・見出し構成を貼り付ける(ラッコキーワード・SERP調査の結果など)
# Claude単体では検索順位や検索ボリュームは分からないため、ここに実データを貼り付けること。
competitors: |
  1位: 「〇〇おすすめランキングTOP10」
    見出し: 選び方のポイント / おすすめ商品10選 / よくある質問
  2位: 「【徹底比較】〇〇の選び方」
    見出し: 〇〇とは / 比較表 / 価格帯別のおすすめ
  3位: 「〇〇レビュー | 実際に使ってみた」
    見出し: 使用レビュー / メリット・デメリット / 購入方法
