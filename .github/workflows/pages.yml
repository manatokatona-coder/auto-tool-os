name: Deploy to GitHub Pages

# dist/（単一ファイル版）をGitHub Pagesに公開する。
# 公開後は iPhone の Safari でそのURLを開き、共有 → ホーム画面に追加 で
# アプリのように使える。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: テスト
        run: node --test
      - name: アイコン生成
        run: node scripts/gen-icons.mjs
      - name: ビルド
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
